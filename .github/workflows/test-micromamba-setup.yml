name: test-micromamba-setup

on:
  push:
    branches: [main, docker]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: aiida-janus
          create-args: >-
            python=${{ matrix.python-version }}
            postgresql
            rabbitmq-server
          init-shell: bash
          cache-environment: false

      - name: Run Micromamba Setup and Calculation Test
        shell: bash -el {0}
        run: |
          bash examples/setup_micromamba/run_setup_and_test.sh --cleanup
